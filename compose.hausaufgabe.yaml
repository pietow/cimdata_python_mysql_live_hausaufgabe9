name: hogwarts-hausaufgabe9
services:
  db:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: hogwarts_hausaufgabe
      MYSQL_USER: homework
      MYSQL_PASSWORD: ${HW_DB_PASSWORD:?Set HW_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${HW_ROOT_PASSWORD:?Set HW_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${HW_DB_PORT:-3309}:3306"
    volumes:
      - homework_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  homework_data:
